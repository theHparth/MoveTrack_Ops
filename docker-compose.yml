services:
  postgres:
    image: postgres:17-alpine
    container_name: movetrack-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres-init:/docker-entrypoint-initdb.d

  claims-service:
    build: ./services/claims-service
    container_name: movetrack-claims-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/claims_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      - postgres

  move-entitlement-service:
    build: ./services/move-entitlement-service
    container_name: movetrack-move-entitlement-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/move_entitlement_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      - postgres
  
  dashboard:
    build: ./frontend/dashboard
    container_name: movetrack-dashboard
    ports:
      - "3000:80"

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  claims-triage-ml:
    build: ./services/claims-triage-ml
    ports:
      - "8000:8000"
    environment:
      REDIS_HOST: redis
    depends_on:
      - redis
      
volumes:
  postgres_data: